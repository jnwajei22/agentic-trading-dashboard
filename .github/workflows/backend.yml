name: Engine storage contracts
on:
  push:
    branches: [main, codex/supabase-persistence]
  pull_request:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r server/requirements.txt
      - name: Local development contracts
        working-directory: server
        run: python -m pytest -q
      - name: Install fresh isolated Postgres schema
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d desk_test -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - name: Native Postgres contracts and concurrent approvals
        working-directory: server
        env:
          DESK_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/desk_test?sslmode=disable
          DESK_TEST_NATIVE_POSTGRES: '1'
        run: python -m pytest -q tests/postgres
